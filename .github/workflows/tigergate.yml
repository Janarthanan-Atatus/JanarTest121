name: TigerGate Security Scan
on:
  pull_request: { branches: [main, master] }
  push: { branches: [main, master] }
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test                       # jest --coverage -> coverage/lcov.info + coverage/lcov-report
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage }
  security-scan:
    needs: test
    runs-on: ubuntu-latest
    container: { image: tigergate/tigergate-cli:latest }            # image entrypoint is the CLI
    permissions:                            # GITHUB_TOKEN is read-only by default
      contents: read
      pull-requests: write                  # PR summary comment
      statuses: write                       # pass/fail commit status
    env:
      TIGERGATE_API_KEY: ${{ secrets.TIGERGATE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # lets --compliance run OpenSSF Scorecard
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }            # full history -> diff-aware PR scans
      - uses: actions/download-artifact@v4
        with: { name: coverage, path: coverage }
      - run: >
          tigergate scan --api-url https://glance-networking-departments-objects.trycloudflare.com/api/ci --type all --scan-scope auto
          --fail-on critical,high --max-critical 0 --max-high 10
          --quality-gate --exclude "node_modules,dist,vendor"
          --sca-ignore-unfixed --coverage-report coverage/lcov.info --coverage-html coverage/lcov-report
          --compliance --upload
