services:
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    # Secrets come from the host environment / an untracked .env file, never from this file.
    environment:
      - JWT_SECRET
      - DB_HOST
      - DB_USER
      - DB_PASSWORD
